# Training Configuration for Improvement
environment:
  nfp_patch_size: 10
  data_path: "data/db/processed/train_db.npz"

  family_size_range: [4, 4]
  episode_length: 60
  resample_length: 0.05
  resample_length_nfp: 0.1
  limit_samples: 2000000
  max_reward: true

training:
  exp_name: "post/01/nfp_random"

  scale:
    total_timesteps: 100000000
    num_envs: 100
    num_episodes: 3

  optimizer:
    learning_rate: 5e-5
    anneal_lr: true
    eps: 1e-5

  settings:
    seed: 1
    torch_deterministic: true
    cuda: true
    use_bf16: true
    save_freq: 40000
    resume_from_checkpoint: false

  ppo:
    curriculum:
      enabled: true
      xi: 1
      max_warmup: 20

    gae_lambda: 0.95
    minibatch_size: 600
    update_epochs: 5
    norm_adv: true
    clip_coef: 0.05
    clip_vloss: true
    ent_coef_item: 0.05
    ent_coef_rotation: 0.01
    ent_coef_place: 0.01
    max_grad_norm: 0.5
    target_kl: 0.01
    gamma: 0.98
    vf_coef: 0.5
    eta: 0.02
    adv_filter_start_after_iteration: 50

model:
  mounted_folder: "/mnt/bucket/"
  pretrained_model_path: null #"nester/final/P4/fix_rotation/20260518_145014/"
  pretrained_checkpoint: checkpoint_9953280000.pt
  num_frozen_layers: 0
  agent_type: "pot"

  model_kwargs:
    data_patch_size: 10
    encoder_config:
      transformer:
        embed_dim: 128
        num_heads: 4
        num_layers: 6
        num_fourier_bands: 32
        num_registers: 0
        layer_norm_eps: 1.0e-5
        activation: "gelu"
        norm_first: false

      mlp_heads:
        num_layers: 5
        hidden_dim: 128

    policy_config:
      rotation_coarse_bins: 72
      rotation_fine_bins: 10
      subregion_bins: 10
      stage2_num_blocks: 4
      max_nfp_components: 3

    value_config:
      hidden_dims: [256, 128, 128, 128]

